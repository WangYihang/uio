# MinIO backs the S3 integration tests (see integration_s3_test.go).
#
#   docker compose up -d
#   UIO_TEST_S3=1 go test ./...
services:
  minio:
    image: bitnami/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=uio
      - MINIO_SCHEME=http
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  minio_data:
